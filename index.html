<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classifido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* -------------------------------------------------------------------------
 * The page ground and the accent are the product's settings surface exactly:
 * --d-s-page #faf8f4, --d-s-accent #0e6455, --d-s-ink #17191b,
 * --d-s-muted-deep #5f6467 (5.65 on this ground). Stated literally because
 * this repo has no tokens file and is not going to grow one for four values.
 * ---------------------------------------------------------------------- */
:root {
  --page: #faf8f4;
  --ink: #17191b;
  --muted: #5f6467;
  --accent: #0e6455;
  --accent-dark: #095a53;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--page);
  color: var(--ink);
  font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont,
               'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-weight: 400;
  line-height: 1.5;
  /* A safe-area pad so the column clears a phone's home indicator and a
     landscape notch. */
  padding: 2rem max(1.5rem, env(safe-area-inset-left))
           calc(2rem + env(safe-area-inset-bottom))
           max(1.5rem, env(safe-area-inset-right));
}

main {
  width: 100%;
  max-width: 30rem;
  text-align: center;
}

/* The mark is sized here and never by an attribute on the svg, which is the
   rule the product's own Wordmark.jsx states: a CSS width silently beats an
   attribute, so the attribute would be a floor any caller could move. */
.mark {
  display: block;
  width: clamp(4.5rem, 14vmin, 6.5rem);
  height: auto;
  margin: 0 auto 1.5rem;
}

h1 {
  margin: 0;
  font-size: clamp(2.25rem, 7vmin, 3.25rem);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.line {
  margin: 0.75rem 0 0;
  font-size: clamp(1.0625rem, 2.6vmin, 1.25rem);
  color: var(--muted);
}

/* ------------------------------------------------------------------ links
 *
 * One face, taken from web/src/link.css in the product repo and not a second
 * one invented here: dotted 1px at 3px offset, solid 1.5px on hover. Every
 * link on this page is an action link -- a control we wrote, not a sentence
 * somebody else's prose runs through -- so all four take the accent at 600.
 *
 * Underlined at rest on every device, because the iPad this page is read on
 * has no hover and a link that grows its underline on :hover has no
 * affordance until it is touched. The hover moves the underline's weight
 * rather than producing one.
 */
a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: underline dotted;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

a:hover {
  text-decoration-style: solid;
  text-decoration-thickness: 1.5px;
  color: var(--accent-dark);
}

a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 2px;
}

nav {
  margin-top: 2.25rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  /* Column-gap carries the separator's breathing room; row-gap is what keeps
     the three readable when a narrow phone wraps them. */
  gap: 0.75rem 1.5rem;
  font-size: clamp(1.0625rem, 2.6vmin, 1.125rem);
}

/* A touch target that clears 44px on a phone without moving the type. The
   pad is what gets it there: at the phone's type size the line box alone is
   about 25px, so 0.65rem top and bottom is the whole of the difference. */
nav a, .contact a {
  display: inline-block;
  padding: 0.65rem 0.25rem;
}

.contact {
  margin: 1.75rem 0 0;
  font-size: 1rem;
}
</style>
</head>
<body>
<main>
  <!-- The mark, shape for shape as it stands in the product's
       assets/signin/mark-4c-tile.svg. The fills stay literal: the brand file
       says do not redraw and do not recolour, and two of them only happen to
       equal this product's ink and accent. -->
  <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="Classifido">
    <rect x="11" y="34" width="23" height="54" rx="11.5" fill="#b8783c"/>
    <rect x="86" y="34" width="23" height="54" rx="11.5" fill="#b8783c"/>
    <rect x="29.5" y="30" width="61" height="53" rx="24" fill="#dda05c"/>
    <rect x="41.5" y="64" width="37" height="39" rx="18.5" fill="#f0c896"/>
    <rect x="52.5" y="80" width="15" height="11" rx="5.5" fill="#17191b"/>
    <rect x="19" y="43" width="34" height="27" rx="10.5" fill="#f2eee6"/>
    <rect x="67" y="43" width="34" height="27" rx="10.5" fill="#f2eee6"/>
    <circle cx="36" cy="56.5" r="6" fill="#17191b"/>
    <circle cx="84" cy="56.5" r="6" fill="#17191b"/>
    <g fill="none" stroke="#17191b" stroke-width="6">
      <rect x="19" y="43" width="34" height="27" rx="10.5"/>
      <rect x="67" y="43" width="34" height="27" rx="10.5"/>
    </g>
    <rect x="52" y="52.5" width="16" height="8" rx="2" fill="#17191b"/>
  </svg>

  <h1>Classifido</h1>
  <p class="line">Your school week in one place.</p>

  <nav>
    <a href="https://app.classifido.com">Sign in</a>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </nav>

  <p class="contact"><a href="mailto:hello@classifido.com">hello@classifido.com</a></p>
</main>
</body>
</html>
