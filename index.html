/* =========================================================================
 * THE LOCKUP HERE IS A COPY OF THE SIGN-IN PAGE'S OUTPUT.
 * =========================================================================
 *
 * Every value below -- the wordmark rules, the cap's placement and its three
 * em steps -- was taken from what `src/render.py` in the product repo
 * actually rendered, by calling `render.sign_in_page()` and reading the
 * document it returned. Nothing here was redrawn, re-derived, or measured
 * off a screenshot.
 *
 * **Why a copy and not a third implementation.** The mortarboard's optical
 * scale is already a deliberate duplication: `web/src/Wordmark.jsx` and
 * `render.py` both hold it because Python cannot import JSX, and
 * `tests/test_wordmark_cap.py` keeps the pair honest with a shared ten-input
 * golden table. A third hand-drawn copy would be a third answer to the same
 * question with no test behind it. This file is a rendered artifact instead:
 * when render.py's changes, re-run it and re-copy. See the README.
 *
 * **The faces, the ground, the ink, the accent, the variable block and the
 * link face are NOT here.** They are the whole site's, not this page's, and
 * they live once in `/site.css`. Only the rules below have no element on any
 * other page.
 * ---------------------------------------------------------------------- */

/* **Top-anchored and not centred**, which is the sign-in page's own comment
   and its own rule. The apex page was vertically centred before this; it is
   not any more, so the mark, the lockup and the line sit exactly where a
   family meets them one click later. */
.frame {
  position: relative;
  overflow: hidden;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: var(--pad-top);
  /* Not the sign-in page's. A phone's home indicator is this page's problem
     because this page can be the first thing a link opens, with none of the
     sign-in flow's chrome below it. */
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
.watermark {
  position: absolute;
  right: -4%;
  bottom: -8%;
  pointer-events: none;
  width: var(--watermark);
  height: var(--watermark);
}
.column {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--col-gap);
  padding: 0 var(--col-pad);
  width: 100%;
  max-width: var(--col-max);
}
.mark { display: block; border-radius: 24%; width: var(--mark); height: var(--mark); }
.type { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.wordmark {
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1;
  white-space: nowrap;
  color: #17191b;
  font-size: var(--wordmark);
}
/* The dotless i, carrying the cap. In `em` so it holds at every size. */
.i { position: relative; display: inline-block; line-height: 1; margin: 0 .06em; }
/* **No width or height here.** The cap is on a three-step scale keyed to the
   type size and this screen crosses a threshold between its own breakpoints,
   so the size comes from the three rules at the foot of this file -- which are
   `sign_in_cap_css()`'s output, character for character. What is left is the
   placement, which does not vary by step. */
.cap {
  position: absolute;
  left: 50%;
  bottom: .60em;
  transform: translateX(-50%);
}
.fido { color: #b8783c; }
.tagline {
  color: #4a4f52;
  text-align: center;
  line-height: 1.45;
  font-size: var(--tagline);
  margin: 0;
}

/* The group under the line sits where the sign-in page's `.action` sits, at
   its width and its 26px. What it holds is links rather than buttons, because
   this page has nothing to submit. */
.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
  width: var(--action);
  max-width: 100%;
}
/* The row's layout is `/site.css`'s. Centring it under the lockup is this
   page's, and only this page's. */
nav { justify-content: center; }

/* ---------------------------------------------- sign_in_cap_css(), verbatim */
.cap { width: .40em; height: .304em; }
@media (max-width: 1014px) { .cap { width: .40em; height: .304em; } }
@media (max-width: 612px) { .cap { width: .42em; height: .319em; } }
</style>
</head>
